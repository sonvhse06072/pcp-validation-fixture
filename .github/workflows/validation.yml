name: validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Style gate
        run: php tools/check-style.php

      - name: Static syntax gate
        run: find web/modules/custom tests tools -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Full tests
        run: php tools/run-tests.php
